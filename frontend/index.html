<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Fonte -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <title>Todo List</title>
</head>

<body>

<main class="container">

    <section class="name">
        <h1 class="title">Todo List</h1>
        <h4 class="title sub">Organize suas tarefas de forma moderna e eficiente</h4>
    </section>
        
    <section class="cards">

        <div id="card1">
            <span class="number">3</span>
            <p>Total</p>
        </div>

        <div id="card2">
            <span class="number">2</span>
            <p>Ativas</p>
        </div>

        <div id="card3">
            <span class="number">1</span>
            <p>Completas</p>
        </div>
        
    </section>

    <section class="add">

        <input name="" form="text" type="text">
        <button onclick="" id="">+ Adicionar</button>

    </section>
        
    <section class="filtros">

        <button id="total">Todas</button>
        <button id="ativa">Ativas</button>
        <button id="completas">Completas</button>

    </section>

    <section class="tarefas">

    </section>
</main>

<script src="script.js"></script>
</body>
</html>
