<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Fonte -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <title>Todo List</title>
</head>

<body>

<main class="container">

    <section class="name">
        <h1>ToDo List</h1>
        <h4>Organize suas tarefas de forma moderna e eficiente</h4>
    </section>
    
    <section class="tela">
        <img src="../specification/assets/Tela.svg" alt="">
        <section class="card-row">  
            <div class="card" id="card1">
                <span class="number">3</span>
                <p class="description">Total</p>
            </div>
            
            <div class="card" id="card2">
                <span class="number">2</span>
                <p class="description">Ativas</p>
            </div>
            
            <div class="card" id="card3">
                <span class="number">1</span>
                <p class="description">Completas</p>
            </div>   
        </section>
    </section>

    <section class="add">

        <input placeholder="Adicionar nova tarefa..." form="text" type="text">
        <button onclick="" id="">Adicionar</button>

    </section>
        
    <section class="filtros">

        <button id="total"><img src="../specification/assets/wordpress_list.svg">Todas</button>
        <button id="ativa"><img src="../specification/assets/tabler_pokeball-off.svg">Ativas</button>
        <button id="completas"><img src="../specification/assets/icon-park-outline_pokeball-one.svg">Completas</button>

    </section>

    <section class="tarefas">

    </section>
</main>

<script src="script.js"></script>
</body>
</html>
